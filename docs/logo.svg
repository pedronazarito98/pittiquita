<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="pittiquita mascot — sleeping tuxedo cat">
  <title>pittiquita</title>
  <desc>Pittiquita — tuxedo cat curled up sleeping, mascot of the react-to-figma capture library</desc>

  <defs>
    <!-- Subtle top-left sheen on the dark fur (light source from upper-left) -->
    <radialGradient id="bodyGrad" cx="38%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Warm soft glow on the tuxedo belly patch -->
    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="56%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBEBEB"/>
    </radialGradient>
  </defs>

  <!-- ── TAIL ──────────────────────────────────────────────────────── -->
  <!-- Flat ellipse drawn behind the body; only the bottom arc is      -->
  <!-- visible after the body covers the center — this is the tail     -->
  <!-- wrapping underneath the sleeping ball                           -->
  <ellipse cx="100" cy="168" rx="76" ry="22" fill="#1a1a1a"/>

  <!-- ── MAIN BODY ─────────────────────────────────────────────────── -->
  <!-- Large rounded ball — the cat curled up in a ball                -->
  <ellipse cx="100" cy="98" rx="66" ry="60" fill="url(#bodyGrad)"/>

  <!-- ── EAR ───────────────────────────────────────────────────────── -->
  <!-- Small pointed ear peeking from the upper-left of the ball       -->
  <path d="M 58,52 L 62,28 L 77,42 Z" fill="#1a1a1a"/>
  <!-- Inner ear: soft rose pink -->
  <path d="M 61,50 L 63,33 L 73,43 Z" fill="#FFB3C1"/>

  <!-- ── TUXEDO BELLY PATCH ────────────────────────────────────────── -->
  <!-- Off-white oval on the lower-center of the body                  -->
  <ellipse cx="100" cy="126" rx="34" ry="24" fill="url(#bellyGrad)"/>

  <!-- ── CLOSED EYES (sleeping arcs ⌢) ───────────────────────────── -->
  <!-- Inverted-arc curves — the universal "cat sleeping" expression   -->
  <path d="M 79,100 Q 86,94 93,100"
        stroke="#DDDDDD" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <path d="M 107,100 Q 114,94 121,100"
        stroke="#DDDDDD" stroke-width="2.3" fill="none" stroke-linecap="round"/>

  <!-- ── NOSE ──────────────────────────────────────────────────────── -->
  <!-- Tiny inverted-triangle heart shape in warm pink                 -->
  <path d="M 100,107 L 103.5,111.5 Q 100,115 96.5,111.5 Z" fill="#FF8FAB"/>

  <!-- ── WHISKERS ──────────────────────────────────────────────────── -->
  <!-- 3 per side, fanning outward from the muzzle                     -->
  <!-- Left -->
  <line x1="50"  y1="103" x2="82"  y2="107" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="48"  y1="110" x2="82"  y2="110" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="50"  y1="117" x2="82"  y2="113" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="118" y1="107" x2="150" y2="103" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="118" y1="110" x2="152" y2="110" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="118" y1="113" x2="150" y2="117" stroke="#CCCCCC" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ── FRONT PAWS ─────────────────────────────────────────────────── -->
  <!-- White toe-tip dots — 3 per paw — suggesting tucked tuxedo paws  -->
  <!-- Left paw -->
  <circle cx="74"  cy="153" r="3" fill="#F5F5F5"/>
  <circle cx="83"  cy="157" r="3" fill="#F5F5F5"/>
  <circle cx="92"  cy="153" r="3" fill="#F5F5F5"/>
  <!-- Right paw -->
  <circle cx="108" cy="153" r="3" fill="#F5F5F5"/>
  <circle cx="117" cy="157" r="3" fill="#F5F5F5"/>
  <circle cx="126" cy="153" r="3" fill="#F5F5F5"/>

  <!-- ── ZZZ ────────────────────────────────────────────────────────── -->
  <!-- Ascending sleep bubbles floating upper-right, outside the body  -->
  <text x="154" y="54"
        font-family="Arial, Helvetica, sans-serif" font-size="10"
        font-weight="bold" fill="#AAAAAA">z</text>
  <text x="161" y="40"
        font-family="Arial, Helvetica, sans-serif" font-size="13"
        font-weight="bold" fill="#AAAAAA" opacity="0.7">z</text>
  <text x="169" y="25"
        font-family="Arial, Helvetica, sans-serif" font-size="16"
        font-weight="bold" fill="#AAAAAA" opacity="0.45">z</text>
</svg>
