name: Publicar no npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publicar pacote
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[skip publish]')"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Atualizar npm
        run: npm install -g npm@latest

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar pacote
        run: pnpm validate

      - name: Conferir conteudo do pacote
        run: npm pack --dry-run

      - name: Conferir se a versao ja existe no npm
        id: version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists on npm. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION does not exist on npm. Publishing."
          fi

      - name: Publicar no npm
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public
