name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test:run

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Conferir conteudo do pacote npm
        run: npm pack --dry-run
